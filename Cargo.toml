[workspace]
members = ["crates/jevia-cli", "crates/jevia-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/assistant-ui/jevia"
authors = ["assistant-ui"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
uuid = { version = "1.0", features = ["v4"] }
