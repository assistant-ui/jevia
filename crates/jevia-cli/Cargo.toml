[package]
name = "jevia"
description = "Outcome-aware model routing CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["llm", "routing", "agents", "cli", "jev"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "jevia"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
clap.workspace = true
jevia-core = { version = "0.1.8", path = "../jevia-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "any"] }
url = "2.5"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
assert_cmd = "2.0"
