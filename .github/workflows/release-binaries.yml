name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, such as v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            install_musl: true
            binary: jevia
            asset_suffix: ""
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            install_musl: true
            binary: jevia
            asset_suffix: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            install_musl: false
            binary: jevia
            asset_suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            install_musl: false
            binary: jevia
            asset_suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            install_musl: false
            binary: jevia.exe
            asset_suffix: .exe
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Confirm tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "jevia") | .version')"
          test "$package_version" = "$expected_version"
      - name: Build release binary
        run: cargo build --locked --release --package jevia --target ${{ matrix.target }}
      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          asset="jevia-${RELEASE_TAG}-${{ matrix.target }}${{ matrix.asset_suffix }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$asset"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod 755 "$asset"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: jevia-${{ matrix.target }}
          path: |
            jevia-${{ env.RELEASE_TAG }}-${{ matrix.target }}${{ matrix.asset_suffix }}
            jevia-${{ env.RELEASE_TAG }}-${{ matrix.target }}${{ matrix.asset_suffix }}.sha256
          if-no-files-found: error

  publish:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: Cargo.lock
          format: spdx-json
          output-file: dist/jevia-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest release build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/jevia-${{ env.RELEASE_TAG }}-*
            !dist/*.sha256
            !dist/*.spdx.json
      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/jevia-${{ env.RELEASE_TAG }}-*
            !dist/*.sha256
            !dist/*.spdx.json
          sbom-path: dist/jevia-${{ env.RELEASE_TAG }}.spdx.json
      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  smoke:
    name: Smoke test installer (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            installer: shell
          - os: macos-15
            installer: shell
          - os: windows-latest
            installer: powershell
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Install from published release assets
        if: matrix.installer == 'shell'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          install_dir="$RUNNER_TEMP/jevia-bin"
          JEVIA_VERSION="$version" \
          JEVIA_INSTALL_DIR="$install_dir" \
            sh website/public/install.sh
          test "$("$install_dir/jevia" --version)" = "jevia $version"
          gh attestation verify "$install_dir/jevia" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$install_dir/jevia" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3
          project="$RUNNER_TEMP/jevia-project"
          mkdir -p "$project"
          cd "$project"
          "$install_dir/jevia" init
          "$install_dir/jevia" runs --json
          "$install_dir/jevia" cache status
      - name: Install from published Windows release asset
        if: matrix.installer == 'powershell'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $installDirectory = Join-Path $env:RUNNER_TEMP "jevia-bin"
          $env:JEVIA_VERSION = $version
          $env:JEVIA_INSTALL_DIR = $installDirectory
          & website/public/install.ps1
          $binary = Join-Path $installDirectory "jevia.exe"
          if ((& $binary --version) -ne "jevia $version") {
            throw "installed Jevia version does not match $version"
          }
          gh attestation verify $binary --repo $env:GITHUB_REPOSITORY
          gh attestation verify $binary `
            --repo $env:GITHUB_REPOSITORY `
            --predicate-type https://spdx.dev/Document/v2.3
          $project = Join-Path $env:RUNNER_TEMP "jevia-project"
          New-Item -ItemType Directory -Path $project -Force | Out-Null
          Push-Location $project
          try {
            & $binary init
            & $binary runs --json
            & $binary cache status
          } finally {
            Pop-Location
          }

  sync-installer:
    name: Open installer version PR
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Update installer release references
        id: update
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-installer-version.mjs "$RELEASE_TAG"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify website
        if: steps.update.outputs.changed == 'true'
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm type-check
      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch="chore/installer-${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add website/public/install.sh website/public/install.ps1 website/src/lib/install-guide.ts
          git commit -m "chore(website): pin installer to ${RELEASE_TAG}"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "$branch"
          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore(website): pin installer to ${RELEASE_TAG}" \
              --body "Updates the public installers and install guide after the ${RELEASE_TAG} release assets passed real macOS, Linux, and Windows smoke tests."
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
