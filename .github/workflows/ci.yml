name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node SDK checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/jevia-node
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/jevia-node/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit
      - name: Check types
        run: pnpm type-check
      - name: Test package
        run: pnpm test
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI for SDK integration tests
        working-directory: .
        run: cargo build --locked -p jevia
      - name: Test SDK against the real CLI
        run: pnpm test:cli
      - name: Verify package contents
        run: npm pack --dry-run

  website:
    name: Website checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit website dependencies
        run: pnpm audit
      - name: Check types
        run: pnpm type-check
      - name: Test website
        run: pnpm test
      - name: Build website
        run: pnpm build
      - name: Test built website
        run: pnpm test:build

  windows-installer:
    name: Windows installer checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test PowerShell installer
        shell: pwsh
        run: ./website/tests/install-powershell.test.ps1

  check:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Verify publishable packages
        run: cargo publish --workspace --dry-run --locked --registry crates-io

  postgres:
    name: PostgreSQL storage
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jevia_test
          POSTGRES_PASSWORD: jevia_test
          POSTGRES_DB: jevia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jevia_test -d jevia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JEVIA_TEST_POSTGRES_URL: postgres://jevia_test:jevia_test@127.0.0.1:5432/jevia_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Test PostgreSQL contracts and complete CLI flow
        run: cargo test --locked -p jevia postgres -- --ignored
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/jevia-node/pnpm-lock.yaml
      - name: Build CLI for PostgreSQL SDK integration
        run: cargo build --locked -p jevia
      - name: Test Node SDK storage against PostgreSQL
        working-directory: packages/jevia-node
        run: pnpm install --frozen-lockfile && pnpm test:cli

  musl:
    name: Linux musl storage build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl C toolchain for bundled SQLite
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build Linux distribution target
        run: cargo build --locked --package jevia --target x86_64-unknown-linux-musl

  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-features
